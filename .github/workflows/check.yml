name: App and video production checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate ZIP updater with isolated fixtures
        shell: pwsh
        run: .\scripts\test-update-replicate-studio.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows SVG wheel and PNG conversion
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: resvg_py==0.5.0
          python -c 'import resvg_py; data = resvg_py.svg_to_bytes(svg_string="<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\"><rect width=\"16\" height=\"16\" fill=\"red\"/></svg>"); assert data[:8] == bytes([137,80,78,71,13,10,26,10])'
  render-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build personal Render image
        run: docker build -t ytb-render-personal .
      - name: Start isolated image with 1 CPU and 2 GB RAM
        run: >-
          docker run -d --name ytb-render-smoke --memory=2g --cpus=1
          --tmpfs /data:rw,size=1g -p 127.0.0.1:18787:10000
          -e PORT=10000 -e YT_SITE_PRIVATE=true -e YT_SITE_USER=alejandro
          -e YT_RENDER_TOKEN=ci-render-smoke-code-not-real-secret
          -e RENDER_EXTERNAL_URL=https://ytb-personal.onrender.com
          ytb-render-personal
      - name: Verify access, render, download and deletion without cloud providers
        run: python scripts/verify-render-container.py
      - name: Container logs
        if: always()
        run: docker logs ytb-render-smoke
      - name: Remove test container
        if: always()
        run: docker rm -f ytb-render-smoke
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci && npm ci --prefix remotion
      - run: npm run check --prefix remotion
      - run: npm run bundle --prefix remotion
      - name: Browser and Remotion end-to-end check
        run: YT_BROWSER_BIN=$(command -v google-chrome || command -v chromium) npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: |
            test-results/production-e2e/*.png
            test-results/production-e2e/*.json
            test-results/production-e2e/*.log
            test-results/production-e2e/remotion.mp4
          retention-days: 14
